<style>
:root{--bg:#f6f7f4;--surface:#fff;--ink:#16302b;--muted:#5d6f6a;--line:#d6ddd9;--accent:#0f5c4d;--accent-ink:#fff;--ok:#1b7a3d;--okbg:#e3f3e8;--bad:#a7321f;--badbg:#fbe9e5;--note:#eef2ef}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101a18;--surface:#182623;--ink:#e8f0ed;--muted:#9bb0aa;--line:#2b3e3a;--accent:#59c3a6;--accent-ink:#06201a;--ok:#6fd392;--okbg:#17382a;--bad:#ff9a85;--badbg:#3d1f19;--note:#1f302c}}
:root[data-theme="dark"]{--bg:#101a18;--surface:#182623;--ink:#e8f0ed;--muted:#9bb0aa;--line:#2b3e3a;--accent:#59c3a6;--accent-ink:#06201a;--ok:#6fd392;--okbg:#17382a;--bad:#ff9a85;--badbg:#3d1f19;--note:#1f302c}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Cairo","Segoe UI",Tahoma,sans-serif;line-height:1.7}
main{max-width:640px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:1.4rem;font-weight:800;margin:0 0 6px}
p{margin:0 0 12px}
.muted{color:var(--muted);font-size:.92rem}
.bar{height:6px;background:var(--line);border-radius:3px;margin:12px 0 6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}
.meta{display:flex;justify-content:space-between;font-size:.85rem;color:var(--muted)}
.tag{display:inline-block;font-size:.8rem;color:var(--accent);border:1px solid var(--line);border-radius:6px;padding:0 8px;margin:14px 0 4px}
.q{font-size:1.15rem;font-weight:600;margin:6px 0 14px}
.opt{display:block;width:100%;text-align:right;font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;margin:0 0 10px;cursor:pointer}
.opt:focus-visible,.btn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.bad{border-color:var(--bad);background:var(--badbg)}
.opt[disabled]{cursor:default}
.note{background:var(--note);border-radius:10px;padding:10px 14px;margin:4px 0 14px;font-size:.95rem}
.btn{font:inherit;font-weight:600;background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:12px 20px;cursor:pointer}
.btn.alt{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
.score{font-size:2.6rem;font-weight:800;margin:8px 0}
.rev{border-top:1px solid var(--line);padding:12px 0}
.rev b{display:block}
.rev span{color:var(--ok)}
.hidden{display:none}.tag.trap{color:var(--bad);border-color:var(--bad)}
</style>
</head>
